<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe3" />
    <title>jo's log</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="jo's log" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: if fonts.googleapis.com is unreachable, the page paints at once with ui-monospace. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" /></noscript>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="frame">
      <header class="top">
        <span id="icon"></span>
        <span class="brand">jo's log</span>
        <div class="meta">
          <span id="note"></span>
          <a id="status" class="status" href="#/settings" hidden></a>
        </div>
      </header>
      <main id="main"></main>
      <nav class="nav" id="nav" hidden>
        <a href="#/log" data-route="log">Log</a>
        <a href="#/week" data-route="week">Week <b class="badge" id="week-badge" hidden></b></a>
        <a href="#/all" data-route="all">All</a>
      </nav>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
